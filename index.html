<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App bewerten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #141420;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --text: #f0f0f5;
      --text-muted: #8888a0;
      --border: rgba(255,255,255,0.06);
      --glow: rgba(108, 92, 231, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px; z-index: 0;
    }
    .bg-glow {
      position: fixed; width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 0; animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); }
    }
    .container {
      position: relative; z-index: 1; text-align: center;
      padding: 2rem; max-width: 440px; width: 100%;
      /* auto margins instead of align-items:center so nothing is cut off
         at the top once the content is taller than the viewport */
      margin: auto;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero { animation: fadeUp 0.5s ease-out; }
    .icon-wrap {
      width: 88px; height: 88px; margin: 0 auto 1.5rem; border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(108, 92, 231, 0.3);
    }
    .icon-wrap svg { width: 44px; height: 44px; fill: #fff; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .subtitle { color: var(--text-muted); font-size: 1rem; line-height: 1.5; margin-bottom: 2rem; }
    .stars { display: flex; justify-content: center; gap: 4px; margin-bottom: 2.5rem; }
    .stars svg { width: 32px; height: 32px; fill: #fbbf24; filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.4)); }

    .app-select { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1rem; animation: fadeUp 0.5s ease-out 0.15s both; }
    .app-card {
      display: flex; align-items: center; gap: 16px; width: 100%; padding: 18px 20px;
      border-radius: 16px; border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-family: inherit; font-size: 1rem; cursor: pointer;
      text-decoration: none; transition: all 0.25s ease; text-align: left;
    }
    .app-card:hover {
      background: rgba(108, 92, 231, 0.08); border-color: rgba(108, 92, 231, 0.25);
      transform: translateY(-2px); box-shadow: 0 4px 20px rgba(108, 92, 231, 0.12);
    }
    .app-card-icon {
      width: 52px; height: 52px; border-radius: 14px; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      font-size: 1.4rem; font-weight: 700; color: #fff;
    }
    .app-card-icon.ding { background: linear-gradient(135deg, #e74c3c, #f39c12); }
    .app-card-icon.bodo { background: linear-gradient(135deg, #00b894, #00cec9); }
    .app-card-icon.mova { background: linear-gradient(135deg, #0984e3, #74b9ff); }
    .app-card-icon.redy { background: linear-gradient(135deg, #e84393, #fd79a8); }
    .app-card-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .app-card-name { font-weight: 700; font-size: 1.05rem; }
    .app-card-desc { font-size: 0.82rem; color: var(--text-muted); }
    .app-card-arrow { flex-shrink: 0; color: var(--text-muted); transition: transform 0.2s ease, color 0.2s ease; }
    .app-card:hover .app-card-arrow { transform: translateX(4px); color: var(--accent-light); }

    .store-view { display: none; }
    .store-view.active { display: block; animation: fadeUp 0.4s ease-out; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 16px 24px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-family: inherit; font-size: 1rem;
      font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .btn:hover {
      background: rgba(108, 92, 231, 0.1); border-color: rgba(108, 92, 231, 0.3);
      transform: translateY(-2px); box-shadow: 0 4px 20px rgba(108, 92, 231, 0.15);
    }
    .btn svg { width: 24px; height: 24px; flex-shrink: 0; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-color: transparent; }
    .btn-primary:hover { background: linear-gradient(135deg, #7c6df0, #b0a8fe); box-shadow: 0 4px 24px rgba(108, 92, 231, 0.35); }

    .auto-msg {
      display: none; margin-bottom: 1.5rem; padding: 10px 16px; border-radius: 10px;
      background: rgba(108, 92, 231, 0.1); border: 1px solid rgba(108, 92, 231, 0.2);
      font-size: 0.85rem; color: var(--accent-light);
    }
    .privacy-note { margin-top: 2rem; font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; opacity: 0.7; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <!-- Hero: only visible on app selection screen -->
    <div class="hero" id="hero">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <h1>App bewerten</h1>
      <p class="subtitle">Deine Bewertung hilft uns, die App noch besser zu machen.</p>
      <div class="stars">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
    </div>

    <!-- App Selection -->
    <div id="view-select">
      <div class="app-select">
        <button class="app-card" onclick="selectApp('ding')">
